<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nearby Notices</title>
<meta name="description" content="Public notices near you in plain English, with food hygiene ratings on the map. Independent, not an official service.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f1f4f5; color: #24323a;
               font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; z-index: 1; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: .7rem; color: #56636b; }
  .spinner { width: 22px; height: 22px; border: 3px solid #cfdcdc; border-top-color: #1f6f6d; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<!-- The GitHub Pages front for Nearby Notices. It shows the live site in a frame, so the service can be reached
     from networks that block newly registered domains. A search can be linked directly, for example
     https://nearby-notices.github.io/?place=Inverness&distance=3&unit=mi -->
<div class="loading" aria-hidden="true"><span class="spinner"></span>Loading Nearby Notices</div>
<iframe id="app" title="Nearby Notices" allow="fullscreen"></iframe>
<script>
(function () {
  var APP = 'https://nearby-notices.bluesea-79d4ea2e.uksouth.azurecontainerapps.io';
  var OK = [APP, 'https://nearbynotices.co.uk', 'https://www.nearbynotices.co.uk'];
  var frame = document.getElementById('app');
  // A search in this page's address is passed through, so a search can be shared as a github.io link.
  var q = new URLSearchParams(location.search);
  frame.src = APP + (q.get('place') ? '/search?' + q.toString() : '/');
  window.addEventListener('message', function (e) {
    if (OK.indexOf(e.origin) < 0 || !e.data || e.data.nn !== 'ready') { return; }
    // Keep this page's address in step with the search shown, so a reload or a shared link opens the same search.
    var path = String(e.data.path || '/');
    var shown = path.indexOf('/search?') === 0 ? path.slice('/search'.length) : '';
    if (shown !== location.search) { history.replaceState(null, '', location.pathname + shown); }
  });
})();
</script>
<noscript><p style="padding:20px">Nearby Notices: <a href="https://nearbynotices.co.uk">nearbynotices.co.uk</a></p></noscript>
</body>
</html>
